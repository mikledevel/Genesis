name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: integration-test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime and test dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libgomp1 postgresql-client
          python -m pip install -r requirements.lock.txt
          python -m pip check
      - name: Prepare private integration schema
        env:
          PGPASSWORD: integration-test-password
        run: psql -h 127.0.0.1 -U postgres -c 'CREATE SCHEMA genesis; REVOKE ALL ON SCHEMA genesis FROM PUBLIC;'
      - name: Run isolated Python suite including PostgreSQL
        env:
          GENESIS_TEST_POSTGRES_URL: postgresql://postgres:integration-test-password@127.0.0.1:5432/postgres
        run: python scripts/check_backend.py tests/ -q --tb=short
      - name: Build isolated model runner
        run: docker build -t genesis-sandbox:latest -f docker/sandbox.Dockerfile docker
      - name: Verify real container boundary
        env:
          GENESIS_TEST_DOCKER: "1"
        run: python scripts/check_backend.py tests/test_docker_model_isolation.py -q --tb=short
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/ui/package-lock.json
      - name: Verify workspace scripts
        run: |
          npm ci --prefix tests/ui
          node tests/ui/ui_test.js
          node tests/ui/admin_test.js
          node tests/ui/antibot_test.js
